plugins {
    id "com.android.application"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def releaseStoreFile = localProperties.getProperty("release.storeFile")
def releaseStorePassword = localProperties.getProperty("release.storePassword")
def releaseKeyAlias = localProperties.getProperty("release.keyAlias")
def releaseKeyPassword = localProperties.getProperty("release.keyPassword")
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "com.dor.happyprayer"
    compileSdk 35

    defaultConfig {
        applicationId "com.dor.happyprayer"
        minSdk 23
        targetSdk 35
        versionCode 103
        versionName "1.3"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Missing release signing settings. Add release.* entries to local.properties; see local.properties.example.")
        }
        if (!rootProject.file(releaseStoreFile).isFile()) {
            throw new GradleException("Release keystore not found: " + releaseStoreFile)
        }
    }
}

tasks.matching { task -> task.name == "assembleRelease" || task.name == "bundleRelease" }.configureEach {
    dependsOn(tasks.named("verifyReleaseSigning"))
}
